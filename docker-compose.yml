
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
    networks:
      - appnet

  web:
    build: .
    ports:
      - "5005:80"
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=DockerTestDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      - db
    networks:
      - appnet

volumes:
  sqlserver-data:

networks:
  appnet:
